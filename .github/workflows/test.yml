# PR 作成・更新時と、main へのマージ直後に単体テストを自動実行する
# （PR 時のチェックをブランチ保護の必須チェックにして、失敗したらマージさせない）
name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # テストに使う Python を用意する
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # test_sales.py の単体テストを実行する（失敗すると PR のチェックが赤くなる）
      - name: Run unit tests
        run: python -m unittest -v test_sales
